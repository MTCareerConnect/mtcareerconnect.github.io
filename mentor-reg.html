:root{--bg:#FBF3EE;--surface:#FFFFFF;--nude:#F6DDD0;--soft:#FDF8F5;--ink:#1B1414;--muted:#6E5A55;--faint:#9C8983;--red:#CC3E3C;--red-deep:#A8231F;--on-red:#FFF7F2;--line:#EBD3C8;
 --good:#2F7D4F;--good-bg:#E4F1E8;--warn:#9A6200;--warn-bg:#FBEFD6;--info:#2D5F86;--info-bg:#E3EEF6;--crit:#B42318;--crit-bg:#FBE4E1;
 --display:"Archivo Black","IBM Plex Sans Thai","Arial Black",system-ui,sans-serif;--body:"IBM Plex Sans Thai",system-ui,sans-serif;--mono:"IBM Plex Mono","IBM Plex Sans Thai",ui-monospace,monospace;
 --r:14px;--shadow:0 1px 2px rgba(60,20,10,.06),0 8px 24px -12px rgba(60,20,10,.18)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--red-deep)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{width:38px;height:38px;border-radius:10px}
.brand b{font:400 17px/1 var(--display);letter-spacing:.2px}.brand small{display:block;font:500 11px/1.3 var(--mono);color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-top:3px}
.top .sp{flex:1}.who{font:500 12.5px/1.3 var(--mono);color:var(--muted);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:920px;margin:0 auto;padding:20px 16px 80px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 18px;padding-bottom:2px;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--muted)}
.tabs button[aria-current=page]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.role{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
.role select{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface)}
h1{font:400 clamp(26px,5.2vw,38px)/1.12 var(--display);margin:6px 0 10px;letter-spacing:-.2px}
h2{font-size:19px;line-height:1.35;margin:0 0 4px}h3{font-size:16px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 18px;max-width:60ch}
.eyebrow{font:600 12px/1.2 var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card.soft{background:var(--soft);box-shadow:none}
.card-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}.card-h .sp{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}.btn.primary:hover{background:var(--red-deep)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent}.btn.sm{min-height:34px;padding:0 12px;border-radius:9px;font-size:13.5px}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>span{font-weight:600;font-size:14.5px}.field>span em{color:var(--red);font-style:normal}
.field small{color:var(--muted);font-size:12.5px;line-height:1.45}
input[type=text],input[type=email],input[type=url],input[type=number],input[type=datetime-local],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:10px 13px;outline:none}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 18%,transparent)}
input[readonly]{background:var(--soft);color:var(--muted)}
.code{font:600 26px/1 var(--mono);letter-spacing:8px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button[disabled]{opacity:.4}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;margin-bottom:10px}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--red);flex:none}
.slots{display:grid;grid-template-columns:76px repeat(3,minmax(0,1fr));gap:6px;max-width:440px}
.slots b{font-size:13px;color:var(--muted);align-self:center}.slots .hd{text-align:center;font-size:12.5px;color:var(--muted)}
.slots button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.slots button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:var(--on-red);font-weight:600}
.slots .na{border:1px dashed var(--line);border-radius:10px;min-height:42px}
.steps{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}
.steps span{flex:1 1 0;min-width:70px;height:6px;border-radius:9px;background:var(--line)}.steps span.on{background:var(--red)}
.steplab{font:600 12px/1.2 var(--mono);color:var(--muted);letter-spacing:.6px;margin-bottom:6px}
.wizbar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 6px;display:flex;gap:10px;align-items:center}
.wizbar .sp{flex:1}
.track{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:0}
.track li{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:16px}
.track li:before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}.track li:last-child:before{display:none}
.track i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font:700 12px/1 var(--mono);color:var(--faint);font-style:normal}
.track li.done i{background:var(--good);border-color:var(--good);color:#fff}.track li.now i{background:var(--red);border-color:var(--red);color:#fff}
.track b{display:block;font-size:15px}.track small{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--soft);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.info{background:var(--info-bg);color:var(--info);border-color:transparent}.pill.red{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.note{border-left:3px solid var(--red);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px;margin:0 0 14px}
.note.warn{border-color:var(--warn)}.note.good{border-color:var(--good)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;margin:0;font-size:14.5px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.person{display:flex;gap:14px;align-items:center}
.av{width:64px;height:64px;border-radius:16px;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--nude)}
.av img{width:100%;height:100%;object-fit:cover}.av svg{width:100%;height:100%}
.choice{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.choice button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:20px;cursor:pointer;box-shadow:var(--shadow)}
.choice button:hover{border-color:var(--red)}.choice b{display:block;font:400 20px/1.2 var(--display);margin:8px 0 6px}
.radio{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--surface)}
.radio input{accent-color:var(--red);width:18px;height:18px}
.radio:has(input:checked){border-color:var(--red);background:color-mix(in srgb,var(--red) 6%,var(--surface))}
.rows .r{display:grid;gap:8px;grid-template-columns:120px 1fr 1fr 36px;margin-bottom:8px}
.rows .r.k3{grid-template-columns:120px 1fr 1fr 36px}.rows .r textarea{grid-column:2/4;grid-row:2;min-height:60px}
.rows .x{grid-column:4;grid-row:1;min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;color:var(--muted)}
.mc{width:100%;max-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.mc-art{aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}.mc-art img{width:100%;height:100%;object-fit:cover}.mc-art svg{width:72%;height:auto}
.mc-body{padding:14px 16px 16px}.mc-body h4{margin:0;font-size:16.5px}.mc-body h4 span{color:var(--muted);font-weight:500}
.mc-body p{margin:4px 0 10px;color:var(--muted);font-size:13.5px}
.tg{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);margin:0 6px 6px 0}.tg.p{background:var(--nude);border-color:transparent}
.split{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) 300px;align-items:start}
.sticky{position:sticky;top:76px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14.5px;z-index:50;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.toast.err{background:var(--crit)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--red);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.center{min-height:50vh;display:grid;place-items:center;text-align:center}
.hero{display:grid;gap:26px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center;padding-top:12px}
.hero ul{margin:0;padding:0 0 0 18px;color:var(--muted)}.hero li{margin:4px 0}
details summary{cursor:pointer;font-weight:600}
.foot{color:var(--faint);font-size:12.5px;text-align:center;margin-top:28px}
@media (max-width:760px){.split,.hero{grid-template-columns:1fr}.sticky{position:static}.kv{grid-template-columns:1fr;gap:0 0}.kv dt{margin-top:8px}
 .rows .r,.rows .r.k3{grid-template-columns:1fr 36px}.rows .r>*:not(.x){grid-column:1}.rows .r .x{grid-column:2;grid-row:1}.rows .r textarea{grid-column:1;grid-row:auto}
 .card{padding:16px}.who{display:none}}

function fmtD(iso){if(!iso)return '—';if(typeof fmtTH==='function')return fmtTH(iso,false);const d=new Date(iso.length===10?iso+'T00:00:00':iso);if(isNaN(d))return '—';return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'})}
function relMs(ms){const a=Math.abs(ms);if(a<H)return Math.max(1,Math.round(a/60e3))+' นาที';if(a<48*H)return Math.round(a/H)+' ชม.';return Math.round(a/D)+' วัน'}

/* ===== capacity, eligibility, scoring ===== */
function capTotal(mr,r){if(!(mr.rounds_avail||[]).includes(r))return 0;const v=r==='R1'?mr.cap_r1:mr.cap_r2;return v==null?1:Number(v)}
function capUsed(mrId,r,exclude){return S.matches.filter(m=>m.mentor_id===mrId&&m.round===r&&m.id!==exclude&&!FREE_CAP.includes(m.status)).length}
function capLeft(mr,r,exclude){return capTotal(mr,r)-capUsed(mr.id,r,exclude)}
function activeMatch(meId,r){return S.matches.find(m=>m.mentee_id===meId&&m.round===r&&!FREE_MENTEE.includes(m.status))}
function prevMatch(meId){return S.matches.find(m=>m.mentee_id===meId&&m.round==='R1'&&['done','feedback','closed'].includes(m.status))}
function menteeBlocked(me,r){if(r==='R2'&&S.matches.some(m=>m.mentee_id===me.id&&m.round==='R1'&&m.status==='noshow'))return 'No-show ในรอบที่ 1';return ''}
function waitReason(me,r){return (me.waitlist||{})[r]||''}
function needsMatch(me,r){return me.screen==='pass'&&!activeMatch(me.id,r)&&!waitReason(me,r)&&!menteeBlocked(me,r)}
function isNear(a,b){return NEAR.some(g=>g.includes(a)&&g.includes(b))}
function kwHits(me,mr){const a=norm([me.situation,me.goal,me.q1,me.q2,me.q3,me.tried].join(' '));const b=norm([mr.highlights,mr.switch_story,mr.title,mr.bio].join(' '));return KEYWORDS.filter(k=>{const n=k.toLowerCase();return a.includes(n)&&b.includes(n)})}
function orgClash(me,mr){const o=norm(me.org);if(!o)return '';const mo=norm(mr.org);if(mo&&(o.includes(mo)||mo.includes(o)))return 'อยู่องค์กรเดียวกัน ('+mr.org+')';const av=String(mr.avoid_orgs||'').split(/[,;\n]/).map(norm).filter(Boolean);const hit=av.find(x=>o.includes(x));return hit?'องค์กรน้องอยู่ในรายชื่อที่พี่ไม่สะดวก':''}
function evaluate(me,mr,r,exclude){
  const W=S.settings.weights,fails=[];
  if(mr.active===false)fails.push('พี่ปิดรับอยู่');
  if(!(mr.rounds_avail||[]).includes(r))fails.push('ไม่ว่างใน'+roundLabel(r));
  else if(capLeft(mr,r,exclude)<=0)fails.push('Capacity '+roundLabel(r)+' เต็ม');
  if(!(mr.topics_offer||[]).includes(me.topic_primary))fails.push('ไม่ได้เปิดหัวข้อ “'+lab(TOPICS,me.topic_primary)+'”');
  else if((mr.topics_avoid||[]).includes(me.topic_primary))fails.push('พี่ไม่สะดวกคุยหัวข้อนี้');
  const hg=mr.help_groups||[],g=groupOf(me.status_level);
  if(hg.length&&!hg.includes('all')&&g&&!hg.includes(g))fails.push('พี่เลือกช่วยเฉพาะ '+labs(HELP,hg).join(', '));
  const coi=orgClash(me,mr);if(coi)fails.push(coi);
  const both=(me.slots||[]).filter(s=>(mr.slots||[]).includes(s));
  if(both.length<2)fails.push('เวลาตรงกัน '+both.length+' ช่อง (ต้อง ≥ 2)');
  const parts={};
  parts.topic=(mr.topics_offer||[]).includes(me.topic_primary)?W.topic:0;
  const pt=me.path_target||[],ph=mr.path_held||[];
  const pHit=pt.filter(p=>ph.includes(p)),pNear=pHit.length?[]:pt.filter(p=>ph.some(q=>isNear(p,q)));
  parts.path=pHit.length?W.path:pNear.length?Math.round(W.path*12/25):0;
  const sec=(me.topic_secondary||[]).filter(x=>(mr.topics_offer||[]).includes(x));
  parts.secondary=Math.min(W.secondary,sec.length*W.secondary/2);
  const pr=LEVEL_PREF.find(o=>o.k===me.level_pref),lv=LEVELS.find(o=>o.k===mr.level);
  parts.level=!pr||pr.k==='any'?W.level:!lv?0:Math.abs(pr.r-lv.r)===0?W.level:Math.abs(pr.r-lv.r)===1?W.level/2:0;
  parts.time=Math.min(W.time,both.length*W.time/5);
  const hits=kwHits(me,mr),key=me.id+'|'+mr.id,ov=S.studio.exp[key];
  parts.exp=ov!=null?ov*W.exp/10:hits.length>=2?W.exp:hits.length===1?W.exp/2:0;
  parts.bg=me.inst&&mr.inst&&norm(me.inst)===norm(mr.inst)?W.bg:0;
  const total=Math.round(Object.values(parts).reduce((a,b)=>a+b,0));
  return {mr,fails,parts,total,both,pHit,pNear,sec,hits,expManual:ov!=null};
}
function candidates(me,r){
  const ex=activeMatch(me.id,r),exId=ex&&ex.id;
  const all=S.mentors.map(mr=>evaluate(me,mr,r,exId));
  const prev=r==='R2'?prevMatch(me.id):null;
  const ok=all.filter(e=>!e.fails.length).sort((a,b)=>(prev&&b.mr.id===prev.mentor_id&&me.want_same!==false)-(prev&&a.mr.id===prev.mentor_id&&me.want_same!==false)||b.total-a.total);
  return {ok,bad:all.filter(e=>e.fails.length),prev};
}
function loadOf(mrId){return S.matches.filter(m=>m.mentor_id===mrId&&!FREE_CAP.includes(m.status)).length}

/* ===== next action per match ===== */
function nextAction(m){
  const hs=S.settings.hours,n=Date.now();
  const mk=(title,sev,due,tpl,hint)=>({title,sev,due,tpl,hint});
  switch(m.status){
    case 'draft':return mk('ตรวจและอนุมัติคู่','info',null,null,(m.score<S.settings.minScore?'คะแนนต่ำกว่า '+S.settings.minScore+' ต้องแก้มือหรือส่ง Waitlist':'ระบบร่างไว้ รอ Ops Lead อนุมัติ'));
    case 'approved':return mk('ส่งอีเมลเสนอคู่ให้พี่','info',null,'propose_mentor','จุดสัมผัสที่ 4 แล้วกด “ส่งเสนอแล้ว”');
    case 'proposed':{const due=t(m.proposed_at)+hs.mentor*H,warn=t(m.proposed_at)+hs.mentorWarn*H;return mk(m.reslot?'รอพี่เสนอเวลาใหม่ 3 ช่วง':'รอพี่ตอบรับคู่',n>due?'crit':n>warn?'warn':'info',due,'propose_mentor',n>due?'เกิน '+hs.mentor+' ชม. ใช้พี่สำรองได้เลย':n>warn?'ผ่าน '+hs.mentorWarn+' ชม. ส่งเตือนพี่ 1 ครั้ง':'')}
    case 'slots':{const due=t(m.slots_at)+hs.mentee*H,warn=t(m.slots_at)+hs.menteeWarn*H;return mk('รอน้องเลือก 1 ใน 3 ช่วง',n>due?'crit':n>warn?'warn':'info',due,'mentee_matched',n>due?'เกิน '+hs.mentee+' ชม. ทัก LINE 1 ครั้ง หรือปิดเป็น Expired':n>warn?'ผ่าน '+hs.menteeWarn+' ชม. ส่งเตือนน้อง':'')}

const chains={};
function queue(path,fn){const p=(chains[path]||Promise.resolve()).then(fn,fn);chains[path]=p.catch(()=>{});return p}
async function write(col,id,data,mode='update'){
  if(!S.db){toast('ยังเชื่อมฐานข้อมูลไม่ได้ เปิดหน้านี้ใน claude.ai แล้วลองใหม่');throw new Error('nodb')}
  return queue(col+'/'+id,async()=>{
    try{const ref=S.db.collection(col).doc(id);if(mode==='set')await ref.set(data);else if(mode==='delete')await ref.delete();else await ref.update(data)}
    catch(e){dbErr(e);throw e}
  });
}
function dbErr(e){const c=e&&e.code;
  if(c==='invalid_argument'&&S.canWrite!==false){S.canWrite=false;toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว ขอสิทธิ์ Contributor จากเจ้าของ');render(true)}
  else if(c==='quota_exceeded')toast('ฐานข้อมูลเต็ม ลบข้อมูลตัวอย่างหรือข้อมูลเก่าในหน้าตั้งค่า');
  else if(c==='unavailable')toast('ระบบขัดข้องชั่วคราว ลองกดอีกครั้ง');
  else toast('บันทึกไม่สำเร็จ ('+(c||'error')+')');}
function hist(m,a,note){const h=(m.history||[]).slice(-59);h.push({t:nowISO(),a,by:S.uid||null,note:note||''});return h}
async function updMatch(m,patch,a,note){patch.history=hist(m,a,note);patch.updated=nowISO();await write('matches',m.id,patch)}
function nextSeq(list,re){let mx=0;for(const x of list){const r=re.exec(x.id||'');if(r)mx=Math.max(mx,Number(r[1]))}return mx+1}
function newMenteeId(round){const rn=round==='R2'?'02':'01';const pre='MTE-'+S.settings.code+rn+'-';return pre+pad(nextSeq(S.mentees,new RegExp('^'+pre+'(\\d+)$')))}
function newMentorId(){return 'MTR-'+pad(nextSeq(S.mentors,/^MTR-(\d+)$/))}
function newMatchId(r){return 'MCH-'+r+'-'+pad(nextSeq(S.matches,new RegExp('^MCH-'+r+'-(\\d+)$')))}

async function saveMatch(me,r,primary,backups,status){
  const ev=evaluate(me,mentorBy(primary),r,(activeMatch(me.id,r)||{}).id);
  const ex=activeMatch(me.id,r);
  const base={mentor_id:primary,backups,score:ev.total,parts:ev.parts,status,updated:nowISO()};
  if(status==='approved'){base.approved_by=S.uid||null;base.approved_at=nowISO()}
  if(ex){
    if(!['draft','approved'].includes(ex.status)){toast('คู่นี้เดินไปถึงขั้น '+ST[ex.status].en+' แล้ว แก้จากหน้า Sessions');return}
    await updMatch(ex,base,status==='approved'?'อนุมัติคู่':'บันทึกร่าง','พี่'+(mentorBy(primary)||{}).nick+' · '+ev.total+' คะแนน');
  }else{
    const id=newMatchId(r);
    const doc=Object.assign({id,round:r,mentee_id:me.id,created:nowISO(),declined:[],reschedule_count:0,demo:!!me.demo},base);
    doc.history=hist({},status==='approved'?'อนุมัติคู่':'สร้างร่างคู่','พี่'+(mentorBy(primary)||{}).nick+' · '+ev.total+' คะแนน');
    await write('matches',id,doc,'set');
  }
  if(waitReason(me,r)){const w=Object.assign({},me.waitlist);delete w[r];await write('mentees',me.id,{waitlist:w})}
}
async function autoDraft(r){
  const pool=S.mentees.filter(me=>needsMatch(me,r));
  if(!pool.length){toast('ไม่มีน้องที่รอจับคู่ใน'+roundLabel(r));return}
  const reserved={};const extra=(id)=>reserved[id]||0;
  const opts=me=>candidates(me,r).ok.filter(e=>capLeft(e.mr,r)-extra(e.mr.id)>0);
  const order=pool.map(me=>({me,n:opts(me).length})).sort((a,b)=>a.n-b.n||String(a.me.created).localeCompare(String(b.me.created)));
  let made=0;const none=[];const writes=[];
  for(const {me} of order){
    const c=opts(me);
    if(!c.length){none.push(me);continue}
    const prev=r==='R2'?prevMatch(me.id):null;
    let pick=prev&&me.want_same!==false&&c.find(e=>e.mr.id===prev.mentor_id);
    if(!pick){const best=c[0].total;pick=c.filter(e=>best-e.total<=5).sort((a,b)=>(loadOf(a.mr.id)+extra(a.mr.id))-(loadOf(b.mr.id)+extra(b.mr.id))||b.total-a.total)[0]}
    reserved[pick.mr.id]=extra(pick.mr.id)+1;
    const backups=c.filter(e=>e.mr.id!==pick.mr.id).slice(0,2).map(e=>e.mr.id);
    const id='MCH-'+r+'-'+pad(nextSeq(S.matches,new RegExp('^MCH-'+r+'-(\\d+)$'))+made);
    writes.push({id,round:r,mentee_id:me.id,mentor_id:pick.mr.id,backups,score:pick.total,parts:pick.parts,status:'draft',created:nowISO(),updated:nowISO(),declined:[],reschedule_count:0,demo:!!me.demo,history:hist({},'สร้างร่างคู่ (Auto-draft)','พี่'+pick.mr.nick+' · '+pick.total+' คะแนน')});
    made++;
  }
  for(const w of writes)await write('matches',w.id,w,'set');
  toast('ร่างคู่ '+made+' คู่'+(none.length?' · ไม่มีพี่ผ่านเกณฑ์ '+none.length+' คน':''));
  S.studio.tab='review';render(true);
}
async function promoteBackup(m,reason){
  const bk=(m.backups||[]).filter(id=>{const mr=mentorBy(id);return mr&&mr.active!==false&&capLeft(mr,m.round,m.id)>0});
  const declined=[...(m.declined||[]),m.mentor_id];
  if(!bk.length){await updMatch(m,{status:'declined',declined},reason,'ไม่มีพี่สำรองที่ยังว่าง');toast('ไม่มีพี่สำรองเหลือ น้องกลับเข้าคิว Matching');return}
  const nxt=bk[0],me=menteeBy(m.mentee_id),ev=evaluate(me,mentorBy(nxt),m.round,m.id);
  await updMatch(m,{mentor_id:nxt,backups:bk.slice(1),declined,score:ev.total,parts:ev.parts,status:'approved',proposed_at:null,reslot:false},reason,'เปลี่ยนเป็นพี่'+mentorBy(nxt).nick);
  toast('ส่งต่อให้พี่'+mentorBy(nxt).nick+' แล้ว กดส่งเสนอคู่อีกครั้ง');
}

function fillTpl(str,v){return str.replace(/\{\{(\w+)\}\}/g,(x,k)=>v[k]!=null?String(v[k]):x)}

/* ===== CSV ===== */
function parseCSV(text){const rows=[];let row=[],f='',q=false;text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));}
const csvCell=v=>{const s=String(v??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function optFromText(opts,text,multi){let s=' '+norm(text)+' ';const out=[];
  const cand=opts.flatMap(o=>[[o.k,norm(o.th)],[o.k,norm(o.en||'')],[o.k,norm(o.k)]]).filter(x=>x[1]&&x[1].length>1).sort((a,b)=>b[1].length-a[1].length);
  for(const [k,l] of cand){const i=s.indexOf(l);if(i>=0){if(!out.includes(k))out.push(k);s=s.slice(0,i)+' '.repeat(l.length)+s.slice(i+l.length);if(!multi)break}}
  return multi?out:(out[0]||'')}
function parseStatus(text){const s=norm(text);const y=/ปี\s*([1-4])|year\s*([1-4])/.exec(s);if(y)return 'y'+(y[1]||y[2]);if(/จบใหม่|new grad/.test(s))return 'new';if(/ทำงาน|work/.test(s))return 'work';return optFromText(MSTATUS,text)}
function parseBool(text){const s=norm(text);return !!s&&!/^(ไม่|no|false|0|n$)/.test(s)}
function parseSlots(header,cell){const out=[];const h=norm(header),c=norm(cell);
  const days=SLOT_ROWS.filter(d=>h.includes(norm(d.th))||h.includes(d.k));const pairs=[];
  if(days.length){for(const d of days)for(const col of SLOT_COLS)if(c.includes(norm(col.th)))pairs.push(d.k+'-'+col.k)}
  else{for(const part of c.split(/[,;\n]/)){const d=SLOT_ROWS.find(x=>part.includes(norm(x.th))||part.includes('จันทร์')&&x.k==='wk');const col=SLOT_COLS.find(x=>part.includes(norm(x.th)));if(d&&col)pairs.push(d.k+'-'+col.k);else if(SLOT_KEYS.includes(part.trim()))pairs.push(part.trim())}}
  for(const p of pairs)if(SLOT_KEYS.includes(p)&&!out.includes(p))out.push(p);return out}
function autoMap(fields,headers){const map={};
  for(const f of fields){
    if(f.t==='slots'){map[f.k]=headers.map((h,i)=>[h,i]).filter(([h])=>new RegExp('\\[slots\\]','i').test(h)||f.syn.some(s=>norm(h).includes(norm(s)))).map(x=>x[1]);continue}
    let i=headers.findIndex(h=>new RegExp('\\['+f.k+'\\]','i').test(h));
    if(i<0)i=headers.findIndex(h=>f.syn.some(s=>norm(h).includes(norm(s))));
    map[f.k]=i;}
  const ts=headers.findIndex(h=>/timestamp|ประทับเวลา/i.test(h));map.__ts=ts;return map}
function rowToRecord(fields,headers,row,map){const r={};
  for(const f of fields){const m=map[f.k];
    if(f.t==='slots'){const s=[];(m||[]).forEach(i=>parseSlots(headers[i],row[i]||'').forEach(x=>{if(!s.includes(x))s.push(x)}));r[f.k]=s;continue}
    if(m==null||m<0)continue;const v=(row[m]||'').trim();
    if(f.t==='multi')r[f.k]=optFromText(f.o,v,true).slice(0,f.max||99);
    else if(f.t==='select')r[f.k]=f.k==='status_level'?parseStatus(v):optFromText(f.o,v,false);
    else if(f.t==='bool')r[f.k]=parseBool(v);
    else if(f.t==='number')r[f.k]=v?Number(v.replace(/[^\d.]/g,''))||0:'';
    else r[f.k]=v;}
  if(map.__ts>=0&&row[map.__ts]){const d=new Date(row[map.__ts]);if(!isNaN(d))r.created=d.toISOString()}
  if(r.email)r.email=r.email.toLowerCase();return r}
function missingReq(fields,rec){return fields.filter(f=>f.req&&(f.t==='bool'?!rec[f.k]:f.t==='multi'||f.t==='slots'?!(rec[f.k]||[]).length:!String(rec[f.k]??'').trim())).map(f=>f.l)}

  consent_program: 'ข้อมูลใช้เพื่อจับคู่และนัดหมายเท่านั้น ทีม Ops ไม่เกิน 3 คนเห็นข้อมูลทั้งหมด', show_org: 'ถ้าไม่ติ๊ก บนเว็บจะแสดงประเภทองค์กรแทนชื่อ'
};
const SITE_PATH = { hospital: 'private', special: 'private', research: 'research', ivd: 'ivd', cabin: 'cabin', content: 'content', owner: 'owner', marketing: 'ivd', advisor: 'ivd', claims: 'ivd' };
const TINTS = { private: '#EEF2E6', research: '#FBF0D9', ivd: '#FBE7DF', cabin: '#E3E9EF', content: '#FBE6E0', owner: '#F1E6DB' };
const h = esc;

/* ---------- server calls ---------- */
function api(fn, ...args) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(r => {
      let j; try { j = JSON.parse(r); } catch (e) { rej(new Error('ระบบตอบกลับผิดรูปแบบ')); return; }
      if (j.ok) res(j); else { if (j.auth) signOut(true); rej(new Error(j.error || 'เกิดข้อผิดพลาด')); }
    }).withFailureHandler(e => rej(new Error(String(e && e.message || e).replace(/^Exception: /, ''))))[fn](...args);
  });
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return PT.ui['mem_' + k] || null; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { PT.ui['mem_' + k] = v; } }
};
function toast(msg, err) {
  const old = $('.toast'); if (old) old.remove();
  const d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.setAttribute('role', 'status'); d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), err ? 6000 : 3200);
}
async function busy(btn, fn) {
  if (PT.busy) return; PT.busy = true;
  const b = btn && btn.closest && btn.closest('button'), txt = b ? b.innerHTML : '';
  if (b) { b.disabled = true; b.innerHTML = '<span class="spin" style="width:16px;height:16px;border-width:2px"></span>'; }
  try { await fn(); } catch (e) { toast(e.message, true); } finally { PT.busy = false; if (b && document.body.contains(b)) { b.disabled = false; b.innerHTML = txt; } }
}
function setState(st) {
  PT.st = st;
  const roles = [st.mentee && 'mentee', st.mentor && 'mentor'].filter(Boolean);
  PT.role = 'mentor';
}

/* ---------- boot / sign in ---------- */
function boot() {
  const go = () => { PT.token = store.get('mtcc_tk'); PT.email = store.get('mtcc_em') || ''; PT.login.email = PT.email; if (PT.token) load(); else render(); };
  try { google.script.url.getLocation(loc => { PT.params = (loc && loc.parameter) || {}; if (PT.params.start === 'mentor' || PT.params.start === 'mentee') PT.role = PT.params.start; go(); }); } catch (e) { go(); }
}
async function load() {
  render('loading');
  try {
    const r = await api('portal_me', PT.token);
    setState(r);
    if (PT.params.go === 'match' && PT.params.m) PT.view = 'home';
    else if (PT.params.start && !r[PT.params.start] && PT.role === PT.params.start && !PT.ui.started) { PT.view = 'apply'; PT.ui.started = true; }
    render();
  } catch (e) { if (PT.token) { toast(e.message, true); render(); } }
}
function signOut(expired) {
  PT.token = null; PT.st = null; PT.form = null; PT.view = 'home'; store.set('mtcc_tk', null);
  PT.login.sent = false; render(); if (expired) toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง');
}

/* ---------- rendering ---------- */
function render(mode) {
  const app = $('#app');
  const top = `<header class="top"><div class="in"><a class="brand" href="#" data-a="home"><img src="${LOGO}" alt=""><span><b>My MTCC</b><small>MT Career Connect</small></span></a><span class="sp"></span>
    ${PT.token && PT.st ? `<span class="who">${h(PT.st.email)}</span><button class="btn sm ghost" data-a="signout">ออกจากระบบ</button>` : ''}</div></header>`;
  let body;
  if (mode === 'loading') body = `<div class="center"><div><span class="spin"></span><p class="muted">กำลังโหลดข้อมูลของคุณ</p></div></div>`;
  else if (!PT.token || !PT.st) body = loginView();
  else body = shell();
  app.innerHTML = top + `<main>${body}<p class="foot">MT Career Connect by MTSAT Alumni · ข้อมูลของคุณใช้เพื่อจับคู่และนัดหมาย Mentoring เท่านั้น</p></main>`;
  const f = $('[data-autofocus]'); if (f) f.focus();
}

    <ul><li>สมัครและบันทึกร่างไว้ทำต่อได้</li><li>ดูว่าใบสมัครอยู่ขั้นไหน เลือกเวลานัด และส่ง Brief ในหน้าเดียว</li><li>พี่ Mentor ตอบรับคู่ เสนอเวลา และแก้โปรไฟล์บนเว็บได้เอง</li></ul></div>

      <form data-form="send"><label class="field"><span>อีเมล</span><input type="email" id="lg-email" value="${h(L.email)}" autocomplete="email" inputmode="email" required data-autofocus></label>

      <form data-form="verify"><label class="field"><span>รหัส</span><input type="text" id="lg-code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required data-autofocus></label>
      <button class="btn primary" style="width:100%" type="submit">เข้าสู่ระบบ</button></form>

}
function tabsFor(role) {
  if (role === 'mentor') return [['home', 'ภาพรวม'], ['apply', 'ข้อมูล Mentor'], ['web', 'โปรไฟล์บนเว็บ'], ['consent', 'ความยินยอม']];
  return [['home', 'ภาพรวม'], ['apply', 'ใบสมัคร'], ['consent', 'ความยินยอม']];
}
function shell() {
  const st = PT.st, roles = [st.mentee && 'mentee', st.mentor && 'mentor'].filter(Boolean);
  if (!PT.role) return chooseRole();
  const tabs = tabsFor(PT.role);
  if (!tabs.some(t => t[0] === PT.view)) PT.view = 'home';
  const sw = roles.length > 1 || (roles.length === 1 && roles[0] !== PT.role) ? `<div class="role">ใช้งานในฐานะ <select data-a="role">${['mentee', 'mentor'].filter(r => roles.includes(r) || r === PT.role).map(r => `<option value="${r}" ${r === PT.role ? 'selected' : ''}>${r === 'mentee' ? 'น้อง Mentee' : 'พี่ Mentor'}</option>`).join('')}</select></div>` : '';
  const nav = `<nav class="tabs" aria-label="เมนู">${tabs.map(([k, l]) => `<button data-a="view" data-v="${k}" ${PT.view === k ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav>`;
  let v;
  if (PT.view === 'apply') v = applyView(PT.role);
  else if (PT.view === 'web') v = webView();
  else if (PT.view === 'consent') v = consentView();
  else v = PT.role === 'mentor' ? mentorHome() : menteeHome();
  return sw + nav + v;
}
function chooseRole() {
  return `<div class="eyebrow">ยินดีต้อนรับ</div><h1>อยากเริ่มจากอะไรดี</h1><p class="lead">อีเมลนี้ยังไม่มีใบสมัครในระบบ เลือกบทบาทของคุณ</p>
  <div class="choice"><button data-a="pick-role" data-v="mentee"><span class="eyebrow">น้อง Mentee</span><b>สมัครรับคำปรึกษา</b><span class="muted">คุยตัวต่อตัวกับพี่ศิษย์เก่าเทคนิคการแพทย์ 60 นาที ออนไลน์ ปีละ 2 Sessions</span></button>
  <button data-a="pick-role" data-v="mentor"><span class="eyebrow">พี่ Mentor</span><b>ลงทะเบียนเป็น Mentor</b><span class="muted">ปีละ 2 Sessions ทีมดูแลเรื่องจับคู่และนัดให้ทั้งหมด</span></button></div>`;

const ME_TRACK = [['ส่งใบสมัคร', 'ระบบส่งอีเมลยืนยันให้'], ['ทีมคัดกรอง', 'ตรวจความครบถ้วนของใบสมัคร'], ['จับคู่กับพี่', 'ทีมเลือกพี่ที่ตรงโจทย์และรอพี่ตอบรับ'], ['เลือกเวลานัด', 'เลือก 1 ใน 3 ช่วงที่พี่เสนอ'], ['คุยกับพี่', 'ส่ง Brief ก่อนนัด แล้วคุยผ่าน Google Meet']];

    <p class="muted">${dr ? 'บันทึกล่าสุด ' + fmtDT(dr.updated) + ' กลับมาทำต่อได้เลย' : 'เตรียมคำถามที่อยากถามพี่ 1–3 ข้อ และไฟล์ Resume (PDF) ไว้ก่อนจะเร็วขึ้น ระบบบันทึกร่างให้ทุกครั้งที่กดถัดไป'}</p>

   ${ms.map(menteeMatchCard).join('')}

function mentorBlock(mr) {

function mentorHome() {

  if (!mr) return `<div class="eyebrow">พี่ Mentor</div><h1>ลงทะเบียนเป็น Mentor</h1>

function fieldHTML(f, v, ro) {
  const id = 'f-' + f.k, req = f.req ? ' <em>*</em>' : '', help = FHELP[f.k] ? `<small>${h(FHELP[f.k])}</small>` : '', dis = ro ? 'disabled' : '';

  if (f.t === 'select') return `<label class="field"><span>${h(f.l)}${req}</span><select id="${id}" data-f="${f.k}" ${dis}><option value="">เลือก</option>${f.o.map(o => `<option value="${o.k}" ${v === o.k ? 'selected' : ''}>${h(o.th)}</option>`).join('')}</select>${help}</label>`;

  }

  const type = f.t === 'number' ? 'number' : f.t === 'url' ? 'url' : f.t === 'email' ? 'email' : 'text';
  if (f.k === 'email') return `<label class="field"><span>${h(f.l)}</span><input type="email" value="${h(PT.st.email)}" readonly><small>อีเมลที่ใช้เข้าสู่ระบบ ระบบส่งอีเมลนัดไปที่อีเมลนี้</small></label>`;

}
function missing(keys) {

    <label class="field"><span>ชื่อภาษาอังกฤษ (ไม่บังคับ)</span><input type="text" data-pubf="en" value="${h(P.en)}"></label>
    <label class="field"><span>ไฮไลต์สั้น 1 บรรทัด (ไม่บังคับ)</span><input type="text" data-pubf="ex" value="${h(P.ex)}" maxlength="220" placeholder="เช่น ex-Application Specialist, IVD Company"></label></div>
   <div class="card"><h2>หัวข้อและความสนใจ</h2>
    <div class="field"><span>หัวข้อที่ให้คำปรึกษา</span><small>ถ้าไม่เลือก ใช้หัวข้อจากข้อมูล Mentor</small><div class="chips">${TOPICS.map(o => `<button type="button" data-a="pub-chip" data-v="top|${h(o.th)}" aria-pressed="${(P.top || []).includes(o.th)}">${h(o.th)}</button>`).join('')}</div></div>
    <label class="field"><span>ความสนใจ (คั่นด้วย ,)</span><input type="text" data-publist="intr" value="${h((P.intr || []).join(', '))}" placeholder="เช่น วิ่ง, Podcast, ทำอาหาร"></label></div>
   <div class="card"><h2>ประวัติ</h2>
    ${rowsEditor('work', 'ประวัติการทำงาน', ['ช่วงปี', 'องค์กร', 'ตำแหน่ง', 'รายละเอียดสั้น ๆ (ไม่บังคับ)'], 'เรียงจากล่าสุด เช่น “ปัจจุบัน” · “2560–2564”')}
    ${rowsEditor('edu', 'ประวัติการศึกษา', ['ปี', 'วุฒิ · สาขา', 'สถาบัน'])}
    ${rowsEditor('train', 'การอบรมและใบประกาศ (ไม่บังคับ)', ['ปี', 'หลักสูตร', 'ผู้จัด'])}</div>
   <div class="card"><h2>ฝากถึง Mentee</h2>
    <label class="field"><span>Mentee ที่พี่กำลังมองหา</span><textarea data-pubf="look" maxlength="400" style="min-height:80px">${h(P.look)}</textarea></label>
    <label class="field"><span>สิ่งที่อยากให้น้องเตรียมตัว</span><textarea data-pubf="prep" maxlength="400" style="min-height:80px">${h(P.prep)}</textarea></label></div>
   <div class="wizbar"><span class="sp"></span><button class="btn primary" data-a="save-pub">บันทึกโปรไฟล์</button></div></div>
  <aside class="sticky"><div class="steplab">ตัวอย่างบนเว็บ</div><div id="pv">${previewCard()}</div><p class="muted small">การ์ดบนหน้า Mentor ของเว็บไซต์ กดการ์ดแล้วจะเห็นประวัติและข้อความฝากถึงน้องทั้งหมด</p></aside></div>`;
}

/* ---------- consent ---------- */
function consentView() {
  const me = PT.st.mentee, mr = PT.st.mentor, L = PT.st.links;
  const rows = [];
  if (me) { const r = me.record; rows.push(['ใช้ข้อมูลเพื่อจับคู่และนัดหมาย', r.consent_program], ['Code of Conduct', r.agree_coc]); }
  if (mr) { const r = mr.record; rows.push(['PDPA + Code of Conduct (Mentor)', r.consent_program], ['แสดงโปรไฟล์บนเว็บไซต์', r.consent_public]); }
  return `<div class="eyebrow">ข้อมูลส่วนบุคคล</div><h1>ความยินยอม</h1>
   <div class="card"><h2>สิ่งที่คุณยินยอมไว้</h2>${rows.length ? `<dl class="kv">${rows.map(r => `<dt>${h(r[0])}</dt><dd>${r[1] ? '<span class="pill good">ยินยอม</span>' : '<span class="pill">ไม่ยินยอม</span>'}</dd>`).join('')}</dl>` : '<p class="muted">ยังไม่มีข้อมูลในระบบ</p>'}
    ${me ? `<label class="check" style="margin-top:14px"><input type="checkbox" data-a="marketing" ${me.record.consent_marketing ? 'checked' : ''}><span>รับข่าวสารกิจกรรมของ MT Career Connect ทางอีเมล</span></label>` : ''}
    ${mr ? `<p class="muted small">เปิดหรือปิดโปรไฟล์บนเว็บได้ในแท็บ “โปรไฟล์บนเว็บ”</p>` : ''}
    ${L.privacy ? `<p><a href="${h(L.privacy)}" target="_blank" rel="noopener">อ่าน Privacy Notice ฉบับเต็ม</a></p>` : ''}</div>
   ${me || mr ? `<div class="card"><h2>ถอนความยินยอมและขอลบข้อมูล</h2><p class="muted">ทีมจะหยุดใช้ข้อมูลเพื่อจับคู่ ซ่อนโปรไฟล์บนเว็บ และลบข้อมูลภายใน 30 วัน คู่ที่นัดไว้แล้วจะถูกยกเลิก</p>
    ${PT.ui.withdraw ? `<div class="note warn">ยืนยันการถอนความยินยอม? ทำแล้วต้องสมัครใหม่ถ้าอยากกลับมาร่วมโครงการ</div><div class="row"><button class="btn" data-a="withdraw-no">ไม่ถอน</button><button class="btn danger" data-a="withdraw-yes">ยืนยันถอนความยินยอม</button></div>` : `<button class="btn danger" data-a="withdraw">ขอถอนความยินยอม</button>`}</div>` : ''}
   ${PT.st.contact ? `<p class="muted small">ติดต่อทีม: <a href="mailto:${h(PT.st.contact)}">${h(PT.st.contact)}</a></p>` : ''}`;
}

/* ---------- events ---------- */
function fileB64(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้')); r.readAsDataURL(file); }); }
function setPath(obj, key, val) { obj[key] = val; }
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const btn = f.querySelector('button[type=submit]');
  if (f.dataset.form === 'send') await busy(btn, async () => { PT.login.email = $('#lg-email').value.trim(); await api('portal_requestCode', PT.login.email); PT.login.sent = true; render(); toast('ส่งรหัสไปที่อีเมลแล้ว'); });
  if (f.dataset.form === 'verify') await busy(btn, async () => {
    const r = await api('portal_verify', PT.login.email, $('#lg-code').value.trim());
    PT.token = r.token; PT.email = r.email; store.set('mtcc_tk', r.token); store.set('mtcc_em', r.email); await load();
  });
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f && PT.form) {
    const F = PT.kind === 'mentee' ? MENTEE_FIELDS : MENTOR_FIELDS, f = F.find(x => x.k === el.dataset.f);
    if (f && f.t !== 'bool') { PT.form[f.k] = f.t === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value; PT.dirty = true; }
  }
  if (el.dataset.pubf) { pubDraft().pub[el.dataset.pubf] = el.value; const pv = $('#pv'); if (pv) pv.innerHTML = previewCard(); }
  if (el.dataset.publist) { pubDraft().pub[el.dataset.publist] = el.value.split(',').map(s => s.trim()).filter(Boolean); }
  if (el.dataset.row) { const [k, i, j] = el.dataset.row.split('|'); const P = pubDraft().pub; P[k][+i][+j] = el.value; }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.f && el.type === 'checkbox' && PT.form) { PT.form[el.dataset.f] = el.checked; PT.dirty = true; }
  if (el.dataset.pub) { pubDraft()[el.dataset.pub] = el.checked; render(); }
  if (el.dataset.a === 'role') { PT.role = el.value; PT.view = 'home'; PT.form = null; render(); }
  if (el.dataset.up && el.files && el.files[0]) {
    const file = el.files[0], kind = el.dataset.up;
    const lim = kind === 'photo' ? 2 : 5;
    if (file.size > lim * 1024 * 1024) { toast('ไฟล์ต้องไม่เกิน ' + lim + ' MB', true); el.value = ''; return; }
    toast('กำลังอัปโหลด…');
    try {
      const r = await api('portal_upload', PT.token, kind, file.name, file.type, await fileB64(file));
      if (kind === 'resume') { PT.form.resume_url = r.url; PT.ui.resumeName = file.name; PT.dirty = true; }
      else { pubDraft().pub.ph = r.url; if (PT.st.mentor) PT.st.mentor.pub = Object.assign({}, PT.st.mentor.pub, { ph: r.url }); }
      render(); toast('อัปโหลดแล้ว');
    } catch (err) { toast(err.message, true); }
  }
});
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el || el.tagName === 'SELECT') return;
  const a = el.dataset.a, v = el.dataset.v;
  if (el.tagName === 'A' && a === 'home') e.preventDefault();
  const act = (name, id, payload, ok) => busy(el, async () => { const r = await api('portal_action', PT.token, name, id, JSON.stringify(payload)); setState(r.state); PT.ui = {}; render(); toast(ok); });
  switch (a) {
    case 'home': if (PT.st) { PT.view = 'home'; render(); } break;
    case 'signout': signOut(); break;
    case 'lg-back': PT.login.sent = false; render(); break;
    case 'lg-resend': busy(el, async () => { await api('portal_requestCode', PT.login.email); toast('ส่งรหัสใหม่แล้ว'); }); break;
    case 'pick-role': PT.role = v; PT.view = 'apply'; PT.form = null; render(); break;
    case 'view': if (PT.view === 'apply' && PT.dirty && !PT.existing) { try { await saveDraft(true); } catch (err) { } } PT.view = v; if (v === 'apply') PT.form = null; if (v === 'web') PT.pub = null; PT.err = []; render(); window.scrollTo(0, 0); break;
    case 'chip': case 'slot': {
      const [k, val] = v.split('|'), F = PT.kind === 'mentee' ? MENTEE_FIELDS : MENTOR_FIELDS, f = F.find(x => x.k === k);
      const arr = (PT.form[k] || []).slice(), i = arr.indexOf(val);
      if (i > -1) arr.splice(i, 1); else if (!f.max || arr.length < f.max) arr.push(val);
      PT.form[k] = arr; PT.dirty = true; const y = window.scrollY; render(); window.scrollTo(0, y); break;
    }
    case 'step': {
      const steps = PT.kind === 'mentee' ? MENTEE_STEPS : MENTOR_STEPS, dir = Number(v);
      if (dir > 0) { const miss = missing(steps[PT.step][2]); if (miss.length && !(PT.existing && PT.kind === 'mentee' && PT.st.mentee.locked)) { PT.err = miss; render(); window.scrollTo(0, 0); return; } }
      PT.err = []; PT.step = Math.max(0, Math.min(steps.length - 1, PT.step + dir)); render(); window.scrollTo(0, 0);
      if (PT.dirty && !PT.existing) saveDraft(true).catch(() => { });
      break;
    }
    case 'save-draft': busy(el, () => saveDraft(false)); break;
    case 'submit': {
      const steps = PT.kind === 'mentee' ? MENTEE_STEPS : MENTOR_STEPS;
      const locked = PT.existing && PT.kind === 'mentee' && PT.st.mentee.locked;
      if (!locked) { for (let i = 0; i < steps.length; i++) { const miss = missing(steps[i][2]); if (miss.length) { PT.step = i; PT.err = miss; render(); window.scrollTo(0, 0); return; } } }
      busy(el, async () => {
        const r = await api('portal_submit', PT.token, PT.kind, JSON.stringify(PT.form));
        setState(r.state); const was = PT.existing; PT.form = null; PT.dirty = false; PT.view = 'home'; render(); window.scrollTo(0, 0);
        toast(was ? 'บันทึกการแก้ไขแล้ว' : PT.kind === 'mentee' ? 'ส่งใบสมัครแล้ว ระบบส่งอีเมลยืนยันให้' : 'ลงทะเบียนแล้ว ขอบคุณที่มาเป็นพี่ Mentor');
      });
      break;
    }
    case 'scale': { const [id, n] = v.split('|'); PT.ui[id] = Number(n); el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); break; }
    case 'pick': {
      const r = document.querySelector(`input[name="pick-${v}"]:checked`); if (!r) { toast('เลือกช่วงเวลาก่อน', true); return; }
      act('pick', v, r.value === 'none' ? { none: true } : { index: Number(r.value) }, r.value === 'none' ? 'แจ้งพี่ให้เสนอเวลาใหม่แล้ว' : 'ยืนยันเวลาแล้ว ระบบส่งนัดและลิงก์ Meet ทางอีเมล'); break;
    }
    case 'brief': act('brief', v, { goal: $('#br-goal-' + v).value, q1: $('#br-q1-' + v).value, q2: $('#br-q2-' + v).value, q3: $('#br-q3-' + v).value }, 'ส่ง Brief ให้พี่แล้ว'); break;
    case 'resched': act('reschedule', v, { reason: ($('#rs-' + v) || {}).value || '' }, 'ส่งคำขอเลื่อนนัดแล้ว'); break;
    case 'fb-me': {
      if (!PT.ui['fb-sc-' + v]) { toast('ให้คะแนนภาพรวมก่อน', true); return; }
      act('feedback', v, { score: PT.ui['fb-sc-' + v], answered: $('#fb-an-' + v).value, action_plan: $('#fb-ap-' + v).value, want_same: $('#fb-ws-' + v).checked, comment: $('#fb-cm-' + v).value }, 'ส่งแบบประเมินแล้ว ขอบคุณมาก'); break;
    }
    case 'fb-mr': {
      if (!PT.ui['fr-r-' + v] || !PT.ui['fr-f-' + v]) { toast('ให้คะแนนให้ครบ 2 ข้อ', true); return; }
      act('feedback', v, { ready: PT.ui['fr-r-' + v], fit: PT.ui['fr-f-' + v], again: $('#fr-ag-' + v).checked, comment: $('#fr-cm-' + v).value }, 'ส่งแบบประเมินแล้ว ขอบคุณพี่มาก'); break;
    }
    case 'accept': {
      const sl = [0, 1, 2].map(i => ($('#sl' + i + '-' + v) || {}).value || '');
      if (sl.filter(Boolean).length < 3) { toast('ใส่เวลาให้ครบ 3 ช่วง', true); return; }
      act('accept', v, { slots: sl }, 'ส่งเวลาให้น้องแล้ว'); break;
    }
    case 'decline': if (!PT.ui['dec-' + v]) { PT.ui['dec-' + v] = true; render(); return; } act('accept', v, { decline: true }, 'แจ้งทีมแล้ว ขอบคุณที่ตอบกลับ'); break;
    case 'resume': busy(el, async () => {
      const r = await api('portal_file', PT.token, 'mentee_resume', v);
      if (r.link) { window.open(r.link, '_blank', 'noopener'); return; }
      const bin = atob(r.b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([u], { type: r.mime })), l = document.createElement('a'); l.href = url; l.download = r.name || 'resume.pdf'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    }); break;
    case 'pub-chip': { const [k, val] = v.split('|'), P = pubDraft().pub, arr = (P[k] || []).slice(), i = arr.indexOf(val); if (i > -1) arr.splice(i, 1); else if (arr.length < 6) arr.push(val); P[k] = arr; const y = window.scrollY; render(); window.scrollTo(0, y); break; }
    case 'row-add': { const [k, n] = v.split('|'), P = pubDraft().pub; P[k] = (P[k] || []).concat([new Array(Number(n)).fill('')]); const y = window.scrollY; render(); window.scrollTo(0, y); break; }
    case 'row-del': { const [k, i] = v.split('|'), P = pubDraft().pub; P[k].splice(Number(i), 1); const y = window.scrollY; render(); window.scrollTo(0, y); break; }
    case 'save-pub': busy(el, async () => { const D = pubDraft(); const r = await api('portal_saveProfile', PT.token, JSON.stringify({ consent_public: D.consent_public, show_org: D.show_org, pub: D.pub })); setState(r.state); PT.pub = null; render(); toast(PT.st.mentor.web === 'live' ? 'บันทึกแล้ว ขึ้นเว็บภายในไม่กี่นาที' : PT.st.mentor.web === 'pending' ? 'บันทึกแล้ว ทีมจะตรวจก่อนขึ้นเว็บ' : 'บันทึกแล้ว'); }); break;
    case 'marketing': busy(null, async () => { const r = await api('portal_consent', PT.token, JSON.stringify({ marketing: el.checked })); setState(r.state); toast('บันทึกแล้ว'); }); break;
    case 'withdraw': PT.ui.withdraw = true; render(); break;
    case 'withdraw-no': PT.ui.withdraw = false; render(); break;
    case 'withdraw-yes': busy(el, async () => { const r = await api('portal_consent', PT.token, JSON.stringify({ withdraw: true })); setState(r.state); PT.ui.withdraw = false; render(); toast('ส่งคำขอถึงทีมแล้ว ทีมจะยืนยันทางอีเมล'); }); break;
  }
});
setInterval(() => { if (PT.view === 'apply' && PT.dirty && !PT.existing && PT.token) saveDraft(true).catch(() => { }); }, 30000);
boot();

</script>
</body></html>

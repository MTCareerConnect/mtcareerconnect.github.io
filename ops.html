<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>MTCC Ops Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left rail (brand + nav) beside a working canvas; record detail opens as a right-hand sheet. Phone: rail becomes a sticky top bar with a scrolling tab strip, sheets go full-screen. */
:root{
  --bg:#FBF3EE; --surface:#FFFFFF; --sunk:#F5E9E2; --nude:#F6DDD0; --ink:#1B1414; --muted:#6E5A55; --faint:#9C8A84;
  --line:#EBD3C8; --line-soft:#F1E3DB; --red:#CC3E3C; --red-deep:#A8231F; --on-red:#FFF7F2; --rail:#1B1414; --rail-ink:#F6E7E0; --rail-muted:#B49C94;
  --good:#2D7A57; --good-bg:#E3F2EA; --warn:#A86A12; --warn-bg:#FBEFD9; --crit:#B42318; --crit-bg:#FBE4E1; --info:#2F4A63; --info-bg:#E4ECF3;
  --f-topic:#8E1E1B; --f-path:#CC3E3C; --f-sec:#E8917B; --f-level:#2F4A63; --f-time:#6E9CB8; --f-exp:#C49A47; --f-bg:#A8958E;
  --display:"Archivo Black","IBM Plex Sans Thai","Arial Black",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans Thai",ui-monospace,Menlo,monospace;
  --r:12px; --r-sm:8px; --shadow:0 1px 2px rgba(27,20,20,.06),0 8px 24px rgba(27,20,20,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151010; --surface:#1F1817; --sunk:#281F1D; --nude:#3A2623; --ink:#F7ECE6; --muted:#BBA59D; --faint:#8E7A73;
  --line:#3A2C29; --line-soft:#2E2321; --red:#E5544F; --red-deep:#F27B72; --on-red:#FFF7F2; --rail:#0E0A0A; --rail-ink:#F6E7E0; --rail-muted:#A38C84;
  --good:#5CC290; --good-bg:#16302A; --warn:#E3A84A; --warn-bg:#33261A; --crit:#FF7B6E; --crit-bg:#3A1C1A; --info:#8DB3D3; --info-bg:#1A2733;
  --f-topic:#D8564F; --f-path:#F08A7E; --f-sec:#F3B7A6; --f-level:#7FA6CC; --f-time:#9CC3DA; --f-exp:#D9B56A; --f-bg:#9E8B84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151010; --surface:#1F1817; --sunk:#281F1D; --nude:#3A2623; --ink:#F7ECE6; --muted:#BBA59D; --faint:#8E7A73;
  --line:#3A2C29; --line-soft:#2E2321; --red:#E5544F; --red-deep:#F27B72; --on-red:#FFF7F2; --rail:#0E0A0A; --rail-ink:#F6E7E0; --rail-muted:#A38C84;
  --good:#5CC290; --good-bg:#16302A; --warn:#E3A84A; --warn-bg:#33261A; --crit:#FF7B6E; --crit-bg:#3A1C1A; --info:#8DB3D3; --info-bg:#1A2733;
  --f-topic:#D8564F; --f-path:#F08A7E; --f-sec:#F3B7A6; --f-level:#7FA6CC; --f-time:#9CC3DA; --f-exp:#D9B56A; --f-bg:#9E8B84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red-deep)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand img{width:38px;height:38px;border-radius:10px;flex:none}
.brand b{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.01em;line-height:1.05;display:block}
.brand small{font-family:var(--mono);font-size:10.5px;color:var(--rail-muted);letter-spacing:.12em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--rail-ink);text-decoration:none;font-weight:500;opacity:.78}
.nav a:hover{opacity:1;background:rgba(255,255,255,.06)}
.nav a[aria-current="page"]{opacity:1;background:var(--red);color:var(--on-red)}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:20px}
.nav a[aria-current="page"] .cnt{background:rgba(0,0,0,.18)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--rail-muted);padding:0 6px}
.rail-foot .who{display:flex;align-items:center;gap:8px;color:var(--rail-ink)}
.rail-foot img{width:24px;height:24px;border-radius:50%}
.sync{display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.off i{background:var(--warn)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft);padding-block:14px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.page{padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:1440px;width:100%}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 13px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--red-deep);border-color:var(--red-deep);color:var(--on-red)}
:root[data-theme="dark"] .btn.primary{background:var(--red);border-color:var(--red)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--red);border-color:var(--red)}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.small button{padding:3px 8px;font-size:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.field>span em{font-style:normal;color:var(--red-deep)}
input[type=text],input[type=search],input[type=email],input[type=url],input[type=number],input[type=date],input[type=datetime-local],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13.5px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--red) 50%,transparent);outline-offset:0;border-color:var(--red)}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search input{padding-left:32px}
.search svg{position:absolute;left:10px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--faint)}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.chk input{accent-color:var(--red-deep);width:15px;height:15px}
.chips-in{display:flex;flex-wrap:wrap;gap:6px}
.chips-in label{display:inline-flex}
.chips-in input{position:absolute;opacity:0;pointer-events:none}
.chips-in span{border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12.5px;cursor:pointer;background:var(--surface)}
.chips-in input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips-in input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:700}
.card-h .note{color:var(--muted);font-size:12.5px}
.card-h .sp{flex:1}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.demo-banner{display:flex;gap:12px;align-items:center;background:var(--info-bg);color:var(--info);border-radius:10px;padding:10px 14px;font-size:13px;flex-wrap:wrap}
.demo-banner b{font-weight:700}
.demo-banner .sp{flex:1}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5;background:var(--sunk);color:var(--muted)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.s-draft{background:var(--sunk);color:var(--muted)}
.pill.s-approved{background:var(--info-bg);color:var(--info)}
.pill.s-proposed,.pill.s-slots{background:var(--warn-bg);color:var(--warn)}
.pill.s-booked,.pill.s-briefed{background:var(--good-bg);color:var(--good)}
.pill.s-done,.pill.s-feedback{background:color-mix(in srgb,var(--good) 22%,var(--surface));color:var(--good)}
.pill.s-closed{background:var(--ink);color:var(--bg)}
.pill.s-expired,.pill.s-noshow,.pill.s-cancelled,.pill.s-declined{background:var(--crit-bg);color:var(--crit)}
.pill.sc-new{background:var(--info-bg);color:var(--info)}
.pill.sc-pass{background:var(--good-bg);color:var(--good)}
.pill.sc-hold{background:var(--warn-bg);color:var(--warn)}
.pill.sc-reject{background:var(--crit-bg);color:var(--crit)}
.pill.sc-waitlist{background:var(--nude);color:var(--red-deep)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:12px;line-height:1.7;white-space:nowrap;color:var(--ink);background:var(--surface)}
.tag.hit{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.tag.near{border-style:dashed}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.demo{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--faint);color:var(--faint);border-radius:5px;padding:0 5px;white-space:nowrap}
.due{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}
.due.warn{color:var(--warn)} .due.crit{color:var(--crit)}
.due svg{width:13px;height:13px}

/* ---------- avatars ---------- */
.av{width:36px;height:36px;border-radius:50%;background:var(--nude);display:grid;place-items:center;flex:none;overflow:hidden}
.av svg{width:118%;height:118%;margin-top:12%}
.av.lg{width:64px;height:64px}
.av.sm{width:28px;height:28px}
.av.luko{background:#E9E4F2} .av.thobi{background:#F1E6D2} .av.aeri{background:#F8D9D3}
:root[data-theme="dark"] .av.luko{background:#2D2936} :root[data-theme="dark"] .av.thobi{background:#352C20} :root[data-theme="dark"] .av.aeri{background:#3A2321}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av.luko{background:#2D2936} :root:not([data-theme="light"]) .av.thobi{background:#352C20} :root:not([data-theme="light"]) .av.aeri{background:#3A2321}}
.who-line{display:flex;align-items:center;gap:10px;min-width:0}
.who-line b{font-weight:600}
.who-line .t{min-width:0;display:flex;flex-direction:column;line-height:1.35}
.who-line .t small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- overview ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .val small{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:500}
.kpi .foot{font-size:12px;color:var(--muted)}
.pipe{display:flex;height:40px;border-radius:9px;overflow:hidden;gap:2px;background:var(--line-soft)}
.pipe button{border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;min-width:28px;color:var(--ink);padding:0 6px;overflow:hidden;white-space:nowrap}
.pipe-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.pipe-legend span{display:inline-flex;align-items:center;gap:6px}
.pipe-legend i{width:10px;height:10px;border-radius:3px}
.queue{display:flex;flex-direction:column}
.qi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line-soft);cursor:pointer;border-radius:8px}
.qi:first-child{border-top:0}
.qi:hover{background:var(--sunk)}
.qi .sev{width:4px;align-self:stretch;border-radius:3px;background:var(--line)}
.qi .sev.warn{background:var(--warn)} .qi .sev.crit{background:var(--crit)} .qi .sev.info{background:var(--info)}
.qi b{font-weight:600}
.qi .meta{font-size:12px;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 16px;color:var(--muted)}
.empty .m{width:84px;height:84px}
.empty b{color:var(--ink);font-size:15px}
.cap{display:flex;flex-direction:column;gap:12px}
.cap-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.cap-big{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.formula{font-family:var(--mono);font-size:12px;background:var(--sunk);border-radius:8px;padding:8px 10px;color:var(--muted);line-height:1.6}
.meter{height:8px;border-radius:5px;background:var(--line-soft);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--ink)}
.meter i.over{background:var(--crit)}
.sd{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 92px;gap:6px 14px;align-items:center;font-size:13px}
.sd .bars{display:flex;flex-direction:column;gap:3px}
.sd .bar{height:9px;border-radius:3px;min-width:2px}
.sd .bar.d{background:var(--red)}
.sd .bar.s{background:var(--info)}
.sd .gap{text-align:right;font-size:12px;font-weight:700}
.sd .gap.crit{color:var(--crit)} .sd .gap.ok{color:var(--good)} .sd .gap.zero{color:var(--faint);font-weight:500}
.sd-legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.sd-legend span{display:inline-flex;gap:6px;align-items:center}
.sd-legend i{width:12px;height:9px;border-radius:2px}
table.kt{width:100%;border-collapse:collapse;font-size:13px}
table.kt th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.kt td{padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.kt td.v{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- tables ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .sp{flex:1}
.tbl-wrap{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:880px}
table.dt th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dt td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.dt tbody tr{cursor:pointer}
table.dt tbody tr:hover{background:var(--sunk)}
table.dt tbody tr:last-child td{border-bottom:0}
.cards{display:none;flex-direction:column;gap:10px}
.rc{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%}
.rc .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.capmini{display:inline-flex;gap:3px;align-items:center}
.capmini i{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--ink)}
.capmini i.used{background:var(--ink)}
.capmini i.res{background:repeating-linear-gradient(45deg,var(--ink) 0 2px,transparent 2px 4px)}
.switch{position:relative;width:34px;height:20px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.switch span{position:absolute;inset:0;border-radius:20px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked+span{background:var(--good)}
.switch input:checked+span::after{transform:translateX(14px)}
.switch input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}

/* ---------- time grid ---------- */
.tg{display:grid;grid-template-columns:auto repeat(3,minmax(30px,46px));gap:3px;font-size:11px;align-items:center}
.tg .h{color:var(--muted);text-align:center;font-weight:600}
.tg .d{color:var(--muted);font-weight:600;padding-right:6px}
.tg .c{height:20px;border-radius:4px;background:var(--line-soft)}
.tg .c.on{background:var(--info)}
.tg .c.both{background:var(--good)}
.tg .c.na{background:transparent;border:1px dashed var(--line)}
.tg.mini{grid-template-columns:auto repeat(3,16px);gap:2px;font-size:10px}
.tg.mini .c{height:10px;border-radius:2px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,12,12,.32);z-index:20;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:21;transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow);border-left:1px solid var(--line)}
.drawer.on{transform:none}
.dh{display:flex;gap:14px;align-items:flex-start;padding:20px 22px 16px;padding-top:max(20px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line-soft);background:var(--surface)}
.dh .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dh h2{font-size:19px;font-weight:700;line-height:1.25}
.dh .ids{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.db{flex:1;overflow-y:auto;padding:18px 22px 40px;padding-bottom:max(40px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;padding-right:max(22px,env(safe-area-inset-right,0px))}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{font-size:12px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;gap:8px;align-items:center}
.sec>h3 .sp{flex:1}
.kv{display:grid;grid-template-columns:132px minmax(0,1fr);gap:7px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.quote{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.qs{display:flex;flex-direction:column;gap:8px;counter-reset:q;margin:0;padding:0;list-style:none}
.qs li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
.qs li::before{counter-increment:q;content:counter(q);font-family:var(--display);color:var(--red);font-size:16px;line-height:1.3}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}
.checks span{display:flex;gap:7px;align-items:center}
.checks svg{width:16px;height:16px;flex:none}
.ok-i{color:var(--good)} .no-i{color:var(--crit)} .na-i{color:var(--faint)}
.screenbox{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.actbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.next{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line-soft);border-left:4px solid var(--info)}
.next.warn{border-left-color:var(--warn)} .next.crit{border-left-color:var(--crit)} .next.good{border-left-color:var(--good)}
.next .nt{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.next .nt b{font-size:15px}
.steps{display:flex;gap:4px;align-items:center}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.done{background:var(--ink)}
.steps i.cur{background:var(--red)}
.steps-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);font-family:var(--mono);margin-top:4px;gap:4px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:14px}
.pair .who-line{cursor:pointer}
.pair .lnk{width:26px;height:26px;color:var(--red)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative}
.tl li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink);margin-top:6px;margin-left:3px}
.tl li::after{content:"";position:absolute;left:6.5px;top:16px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl .m{font-size:12px;color:var(--muted)}
.slots-in{display:grid;gap:8px}
.slot-pick{display:flex;flex-direction:column;gap:6px}
.slot-pick label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;background:var(--surface)}
.slot-pick input{accent-color:var(--red-deep)}

/* ---------- studio ---------- */
.studio{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.mlist{display:flex;flex-direction:column;gap:6px;position:sticky;top:84px;max-height:calc(100vh - 110px);overflow-y:auto;padding-right:2px}
.mli{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line-soft);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.mli[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mli .t{min-width:0;display:flex;flex-direction:column;line-height:1.35}
.mli .t small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt{font-family:var(--mono);font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 6px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.opt.zero{background:var(--crit-bg);color:var(--crit)} .opt.one{background:var(--warn-bg);color:var(--warn)}
.brief{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:16px}
.brief .q{font-size:13.5px;line-height:1.55}
.cand{display:flex;flex-direction:column;gap:10px}
.cr{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:28px minmax(0,1fr) 210px;gap:14px;align-items:start}
.cr.primary{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.cr.backup{border-color:var(--ink)}
.cr .rk{font-family:var(--display);font-size:18px;color:var(--faint);line-height:1.4}
.cr.primary .rk{color:var(--red)}
.cr .body{min-width:0;display:flex;flex-direction:column;gap:9px}
.cr .side{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.score{display:flex;align-items:baseline;gap:6px;justify-content:flex-end}
.score b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.score small{color:var(--muted)}
.sbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line-soft)}
.sbar i{display:block;height:100%}
.parts{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.parts span{display:inline-flex;align-items:center;gap:5px}
.parts i{width:8px;height:8px;border-radius:2px}
.parts b{color:var(--ink);font-family:var(--mono);font-weight:600}
.why{font-size:12.5px;color:var(--muted)}
.why b{color:var(--ink);font-weight:600}
.fails{display:flex;flex-direction:column;gap:6px}
.fails .fr{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:12px;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line-soft)}
.fails .fr .rs{color:var(--crit);font-size:12.5px}
details.more summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);padding:6px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ ";}
details.more[open] summary::before{content:"▾ ";}
.stickybar{position:sticky;bottom:0;margin-top:4px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 0;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:3}
.stickybar .sum{flex:1;min-width:200px;font-size:13px;color:var(--muted)}
.stickybar .sum b{color:var(--ink)}

/* ---------- board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px;font-size:12.5px;font-weight:700}
.col-h .c{font-family:var(--mono);color:var(--muted);font-weight:500}
.col-h .th{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.bc{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left;width:100%}
.bc:hover{border-color:var(--muted)}
.bc .pp{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;min-width:0}
.bc .pp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.bc.flag{border-color:var(--crit)}

/* ---------- import ---------- */
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--surface)}
.drop.over{border-color:var(--red);background:var(--nude)}
.map{display:grid;grid-template-columns:minmax(160px,1fr) minmax(160px,1.2fr) minmax(0,1.4fr);gap:8px 14px;align-items:center;font-size:13px}
.map .h{font-size:11.5px;font-weight:600;color:var(--muted)}
.map .sample{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat3{display:flex;gap:18px;flex-wrap:wrap}
.stat3 div{display:flex;flex-direction:column}
.stat3 b{font-family:var(--display);font-size:24px}
.stat3 span{font-size:12px;color:var(--muted)}

/* ---------- docs ---------- */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.doc{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink)}
.doc:hover{border-color:var(--muted)}
.doc .k{display:flex;justify-content:space-between;align-items:center}
.doc h3{font-size:15.5px;font-weight:700}
.doc p{font-size:13px;color:var(--muted);line-height:1.55}
.doc .aud{font-size:12px;font-weight:600;margin-top:auto}

/* ---------- modal + toast ---------- */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:40;padding:16px;background:rgba(20,12,12,.4)}
.modal[hidden]{display:none!important}
.mbox{background:var(--bg);border-radius:14px;width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line)}
.mbox .mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.mbox .mh h2{font-size:16px;flex:1}
.mbox .mb{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.mbox .mf{padding:12px 18px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mail{font-family:var(--body);white-space:pre-wrap;min-height:260px}
.ph{background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:0 3px}
.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:50;opacity:0;transition:all .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--crit-bg);color:var(--crit);border-radius:9px;padding:8px 10px;font-size:13px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--line-soft),var(--sunk),var(--line-soft));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- responsive ---------- */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}.cr{grid-template-columns:28px minmax(0,1fr)}.cr .side{grid-column:2}}
@media (max-width:900px){

  .brand{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:none;padding:7px 11px}
  .rail-foot{display:none}
  .top{position:static;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .studio{grid-template-columns:minmax(0,1fr)}
  .mlist{position:static;max-height:none;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .mli{min-width:240px}
  .grid3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .val{font-size:24px}
  .tbl-wrap.resp{display:none}
  .cards{display:flex}
  .kv{grid-template-columns:minmax(0,1fr);gap:2px}
  .kv dd{margin-bottom:8px}
  .checks{grid-template-columns:1fr}
  .sd{grid-template-columns:minmax(0,1fr) 70px}
  .sd .lbl{grid-column:1/-1;margin-top:4px}
  .map{grid-template-columns:minmax(0,1fr)}
  .map .h{display:none}
  .fails .fr{grid-template-columns:minmax(0,1fr)}
  .pair{grid-template-columns:minmax(0,1fr)}
  .pair .lnk{transform:rotate(90deg);justify-self:center}
  .brief{grid-template-columns:minmax(0,1fr)}
  .cr{grid-template-columns:minmax(0,1fr)}
  .cr .rk{display:none}
  .cr .side{grid-column:1}
  .board{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:minmax(0,1fr)}
  .dh{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .db{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
table.kt{min-width:560px}
table.kt td:first-child{min-width:170px}
table.dt td.nw{white-space:nowrap}
.toolbar .search{min-width:240px}
@media (max-width:900px){.brand small{display:none}.brand img{width:30px;height:30px}.brand b br{display:none}.brand b{font-size:14px}}
